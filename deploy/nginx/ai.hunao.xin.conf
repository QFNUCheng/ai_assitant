# 宝塔 nginx 站点配置：ai.hunao.xin → 容器 127.0.0.1:18120
#
# 用法（在服务器上）：
#   1) 复制到宝塔 vhost 目录
#        cp deploy/nginx/ai.hunao.xin.conf /www/server/panel/vhost/nginx/
#   2) 先确保证书已就位（见文件末尾说明），再重载 nginx
#        nginx -t && nginx -s reload
#
# 结构与本机既有站点（love.hunao.xin / blog.hunao.xin）保持一致。

server {
    listen 80;
    listen [::]:80;
    server_name ai.hunao.xin;

    # 证书 HTTP-01 校验走这里
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.hunao.xin;

    ssl_certificate     /www/server/panel/vhost/cert/ai.hunao.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ai.hunao.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIH_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # 知识库上传接口：nginx 默认上限 1MB，会直接返回 413
    client_max_body_size 25m;
    client_body_timeout 120s;

    # 健康检查不记日志
    location = /health {
        proxy_pass http://127.0.0.1:18120/health;
        access_log off;
    }

    # 本项目是纯 API 后端（无前端静态资源），全部路径直通容器
    location / {
        proxy_pass http://127.0.0.1:18120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 对话接口会调用大模型，耗时较长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/ai.hunao.xin.log;
    error_log  /www/wwwlogs/ai.hunao.xin.error.log;
}

# 证书：本机所有站点都放在 /www/server/panel/vhost/cert/<域名>/{fullchain,privkey}.pem。
# 两种签发方式，任选其一：
#   a) 宝塔面板 → 网站 → 添加站点 ai.hunao.xin → SSL → Let's Encrypt 申请（推荐，自动续期）
#   b) 命令行 acme.sh：
#        acme.sh --issue -d ai.hunao.xin --webroot /www/wwwroot/ai.hunao.xin
#        acme.sh --install-cert -d ai.hunao.xin \
#          --key-file       /www/server/panel/vhost/cert/ai.hunao.xin/privkey.pem \
#          --fullchain-file /www/server/panel/vhost/cert/ai.hunao.xin/fullchain.pem \
#          --reloadcmd      "nginx -s reload"
